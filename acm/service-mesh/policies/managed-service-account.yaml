apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: managed-service-account
  namespace: global-mesh-policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: AC Access Control
    policy.open-cluster-management.io/controls: AC-2 Account Management
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: managed-service-account
        spec:
          severity: high
          object-templates-raw: |
            {{- range $cluster := (lookup "cluster.open-cluster-management.io/v1" "ManagedCluster" "" "").items }}
            {{- if and (hasKey $cluster.metadata.labels "meshID") (eq (index $cluster.metadata.labels "meshID") "global-mesh") }}
            - complianceType: musthave
              objectDefinition:
                apiVersion: authentication.open-cluster-management.io/v1beta1
                kind: ManagedServiceAccount
                metadata:
                  name: istio-reader-service-account
                  namespace: {{ $cluster.metadata.name }}
                spec:
                  rotation:
                    enabled: true
                    validity: 24h
            {{- else }}
            - complianceType: mustnothave
              objectDefinition:
                apiVersion: authentication.open-cluster-management.io/v1beta1
                kind: ManagedServiceAccount
                metadata:
                  name: istio-reader-service-account
                  namespace: {{ $cluster.metadata.name }}
            {{- end }}
            {{- end }}

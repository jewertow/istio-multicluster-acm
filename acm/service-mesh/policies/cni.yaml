apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: cni
  namespace: global-mesh-policies
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/standards: Istio Service Mesh
    policy.open-cluster-management.io/controls: Istio Installation
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: cni
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: MustHave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: istio-cni
            - complianceType: MustHave
              objectDefinition:
                apiVersion: sailoperator.io/v1
                kind: IstioCNI
                metadata:
                  name: default
                spec:
                  version: v1.30-latest
                  namespace: istio-cni

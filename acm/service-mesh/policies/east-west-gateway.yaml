apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: east-west-gateway
  namespace: global-mesh-policies
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/standards: Istio Service Mesh
    policy.open-cluster-management.io/controls: Gateway Management
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: east-west-gateway
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: MustHave
              objectDefinition:
                apiVersion: gateway.networking.k8s.io/v1
                kind: Gateway
                metadata:
                  name: eastwestgateway
                  namespace: istio-system
                  labels:
                    topology.istio.io/network: 'network-{{hub .ManagedClusterName hub}}'
                spec:
                  gatewayClassName: istio
                  listeners:
                    - name: cross-network
                      hostname: "*.local"
                      port: 15443
                      protocol: TLS
                      tls:
                        mode: Passthrough

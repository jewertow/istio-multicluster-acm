apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: curl
  namespace: istio-policies
  annotations:
    policy.open-cluster-management.io/categories: CM Configuration Management
    policy.open-cluster-management.io/standards: Istio Service Mesh
    policy.open-cluster-management.io/controls: Application Management
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: curl
        spec:
          remediationAction: enforce
          severity: high
          object-templates:
            - complianceType: MustHave
              objectDefinition:
                apiVersion: v1
                kind: ServiceAccount
                metadata:
                  name: curl
                  namespace: sample
            - complianceType: MustHave
              objectDefinition:
                apiVersion: v1
                kind: Service
                metadata:
                  name: curl
                  namespace: sample
                  labels:
                    app: curl
                    service: curl
                spec:
                  ports:
                    - port: 80
                      name: http
                  selector:
                    app: curl
            - complianceType: MustHave
              objectDefinition:
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: curl
                  namespace: sample
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: curl
                  template:
                    metadata:
                      labels:
                        app: curl
                    spec:
                      terminationGracePeriodSeconds: 0
                      serviceAccountName: curl
                      containers:
                        - name: curl
                          image: docker.io/curlimages/curl:8.16.0
                          command: ["/bin/sleep", "infinity"]
                          imagePullPolicy: IfNotPresent
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: mesh-clusters-v1-curl
  namespace: istio-policies
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: mesh-clusters-v1
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: curl
